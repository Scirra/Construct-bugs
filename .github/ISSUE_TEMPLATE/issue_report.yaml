name: New issue report
description: Submit a new issue report for Construct. Please review the bug report guidelines and fill out all the required fields, otherwise we may be unable to help you.
body:
  - type: markdown
    attributes:
      value: |
        Please review the bug report guidelines and fill out all the required fields, otherwise we may be unable to help you. Please always fill out the full details every time with every report, even if you think the problem is obvious (it often is not).
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      description: Please confirm you have made the following checks before submitting this report.
      options:
        - label: I have read and understand the bug report guidelines
          required: true
        - label: I checked for existing similar reports to avoid submitting a duplicate
          required: true
        - label: I verified the issue occurs in the latest beta release to avoid submitting an issue that has already been resolved
          required: true
  - type: textarea
    id: problem-description
    attributes:
      label: Problem description
      description: Enter a concise description of the issue here.
    validations:
      required: true
  - type: upload
    id: project-file
    attributes:
      label: Upload a project
      description: Please upload a minimal project file demonstrating the issue. Zip the project file to allow upload, or rename .c3p to .zip.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Please write numbered steps we can follow after opening your project to observe the reported issue. There is no need to describe how you made your project. Please be as specific and clear as possible.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: observed-result
    attributes:
      label: Observed result
      description: After opening the project and following the steps, what do you see happen?
    validations:
      required: true
  - type: textarea
    id: expected-result
    attributes:
      label: Expected result
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: affected-platforms
    attributes:
      label: Affected platforms
      description: If only certain platforms are affected, please indicate which. You can select more than one. Providing this information can help us resolve the problem more quickly.
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Chrome OS
        - Android
        - iOS
  - type: dropdown
    id: affected-browsers
    attributes:
      label: Affected browsers
      description: If only certain browsers are affected, please indicate which. You can select more than one. Providing this information can help us resolve the problem more quickly.
      multiple: true
      options:
        - Chrome
        - Edge
        - Other Chromium-based browser (Opera, Yandex, etc.)
        - Firefox
        - Safari
  - type: input
    id: last-unaffected-release
    attributes:
      label: Last unaffected release
      description: If this issue relates to something that used to work but is now broken, please provide the latest Construct release that worked before it broke, e.g. r401. Providing this information can help us resolve the problem more quickly.
  - type: input
    id: first-affected-release
    attributes:
      label: First affected release
      description: If this issue relates to something that used to work but is now broken, please provide the earliest Construct release that had the issue, e.g. r402. Providing this information can help us resolve the problem more quickly.
  - type: textarea
    id: additional-remarks
    attributes:
      label: Additional remarks
      description: If there is anything else you'd like to mention, you can write it here.
  - type: textarea
    id: platform-info
    attributes:
      label: Platform information
      description: On a device exhibiting the issue, please load Construct, choose **Menu > About**, click **Platform information**, click **Copy**, and then paste the result in to this field.
    validations:
      required: true
